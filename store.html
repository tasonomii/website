<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store — TASONOMII</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0ece3;
      --bg-secondary: #e8e2d6;
      --text-primary: #2a2a2a;
      --text-secondary: #8a8578;
      --border: rgba(0,0,0,0.08);
      --border-hover: rgba(0,0,0,0.18);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
    }

    /* NAV */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      border-bottom: 0.5px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 100;
    }
    .logo {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.1em;
      color: var(--text-primary);
      text-decoration: none;
    }
    .nav-links {
      display: flex;
      gap: 28px;
    }
    .nav-links a {
      font-size: 13px;
      color: var(--text-secondary);
      text-decoration: none;
      transition: color 0.15s;
    }
    .nav-links a:hover { color: var(--text-primary); }
    .nav-links a.active { color: var(--text-primary); }

    /* PAGE HEADER */
    .page-header {
      padding: 48px 40px 8px;
    }
    .page-header h1 {
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* STORE */
    .store {
      padding: 40px;
      max-width: 720px;
    }
    .store-card {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      padding: 40px;
      text-align: center;
    }
    .store-icon {
      font-size: 48px;
      margin-bottom: 20px;
    }
    .store-card h2 {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 12px;
    }
    .store-card p {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.8;
      margin-bottom: 28px;
    }
    .store-btn {
      display: inline-block;
      font-size: 14px;
      font-weight: 500;
      padding: 12px 40px;
      border: 0.5px solid var(--border-hover);
      border-radius: 28px;
      color: var(--text-primary);
      text-decoration: none;
      transition: all 0.15s;
    }
    .store-btn:hover {
      background: var(--text-primary);
      color: var(--bg);
      border-color: var(--text-primary);
    }
    .store-note {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 16px;
    }

    @media (max-width: 480px) {
      nav { padding: 16px 20px; }
      .page-header { padding: 32px 20px 4px; }
      .store { padding: 24px 20px; }
      .store-card { padding: 28px 20px; }
    }

    /* FOOTER */
    footer {
      padding: 22px 40px;
      border-top: 0.5px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .footer-copy {
      font-size: 12px;
      color: var(--text-secondary);
    }
    .social-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .social-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 6px 14px;
      border: 0.5px solid var(--border-hover);
      border-radius: 20px;
      color: var(--text-secondary);
      text-decoration: none;
      transition: all 0.15s;
    }
    .social-btn:hover {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border-color: var(--text-secondary);
    }
    .social-btn svg { flex-shrink: 0; }
  </style>
</head>
<body>

  <nav>
    <a class="logo" href="index.html">TASONOMII.com</a>
    <div class="nav-links">
      <a href="works.html">works</a>

      <a href="store.html" class="active">store</a>

      <a class="store-btn" href="https://tasonomii.booth.pm/" target="_blank" rel="noopener">BOOTHで購入する →</a>

</body>
