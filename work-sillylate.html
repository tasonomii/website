<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Silly Late — TASONOMII.com</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0ece3;
      --bg-secondary: #e8e2d6;
      --text-primary: #2a2a2a;
      --text-secondary: #8a8578;
      --border: rgba(0,0,0,0.08);
      --border-hover: rgba(0,0,0,0.18);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      border-bottom: 0.5px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 100;
    }
    .logo {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.1em;
      color: var(--text-primary);
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 28px; }
    .nav-links a {
      font-size: 13px;
      color: var(--text-secondary);
      text-decoration: none;
      transition: color 0.15s;
    }
    .nav-links a:hover { color: var(--text-primary); }

    .work-hero {
      width: 100%;
      border-bottom: 0.5px solid var(--border);
    }
    .work-hero img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      aspect-ratio: 16 / 9;
    }

    .work-content {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }
    .work-category {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }
    .work-content h1 {
      font-size: 32px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
      color: var(--text-primary);
    }
    .work-meta {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }
    .work-desc {
      font-size: 14px;
      color: var(--text-primary);
      line-height: 1.9;
      margin-bottom: 32px;
    }
    .work-desc p + p { margin-top: 16px; }
    .back-link {
      display: inline-block;
      font-size: 13px;
      color: var(--text-secondary);
      text-decoration: none;
      padding: 10px 20px;
      border: 0.5px solid var(--border-hover);
      border-radius: 20px;
      transition: all 0.15s;
    }
    .back-link:hover {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border-color: var(--text-secondary);
    }

    @media (max-width: 480px) {
      nav { padding: 16px 20px; }
      .work-content { padding: 32px 20px 60px; }
      .work-content h1 { font-size: 26px; }
    }
  </style>
</head>
<body>

  <nav>
    <a class="logo" href="index.html">TASONOMII.com</a>
    <div class="nav-links">
      <a href="works.html">works</a>
      <a href="about.html">about</a>
      <a href="store.html">store</a>
      <a href="blog.html">blog</a>
    </div>
  </nav>

  <div class="work-hero">
    <img src="https://img.youtube.com/vi/T5DAMHuz4ZM/maxresdefault.jpg" alt="Silly Late">
  </div>

  <div class="work-content">
    <p class="work-category">Animation</p>
    <h1>Silly Late</h1>
    <p class="work-meta">2025 · Animated Short Film</p>
    <div class="work-desc">
      <p>2025年11月に公開されたアニメーション作品。時間に追われる日々の中で起こる、ちょっとシュールで愛らしい出来事を描いたショートフィルムです。</p>
    </div>
    <a class="back-link" href="works.html">← Back to Works</a>
  </div>

</body>
</html>
